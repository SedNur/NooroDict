<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SNTG</title>
    <style>
        :root {
            --page-bg: #f9f9ff;
            --search-bg: #ffffff;
            --search-color: #110817;
            --search-border: #c75a00;
            --result-bg: #fffefb;
            --term-color: navy;
            --source-color: olive;
            --text-color: #110817;
            //            --bullet-color: #993300;
            --domain-color: #993300;
            --domain-bg: #fffaf7;
            --domain-border: #f9d3f0;
            --main-border: #ccc;
            --suggestions-bg: #ffffea;
            --suggestions-hover-bg: #f0f0f0;
            --suggestions-separator: #ccc;
            //            --selected-bg: #e0e0e0;

            --links-color: #0018ff;
            --derivatives-color: #bd663fd3;
            --derivatives-items-color: #4b7296e7;

            //            --status-color: #888;
            //            --menu-toggle: #fff;
            //            --menu-bg: #fff;
            //            --menu-hover-bg: #f0f0f0;
            //            --submenu-bg: #fafafa;
            //            --submenu-hover-bg: #eef2f7;
            //            --menu-border: #ccc;

            --modal-bg: #f5f7ff;
            --modal-overlay: rgba(0, 0, 0, 0.35);

            //            --order-button-color: #82502b;
            //            --order-button-hover-color: #000;

        }

        html.dark-mode {
            --page-bg: #12161c;
            --search-bg: #1b2129;
            --search-color: #e7e9ed;
            --search-border: #c77a3a;
            --result-bg: #1b2129;
            --main-border: #3b4654;

            --term-color: #9fc5ff;
            //            --source-color: #c9c97a;
            --text-color: #e7e9ed;

            //            --bullet-color: #993300;
            --domain-color: #e09045;
            --domain-bg: #352f00;
            --domain-border: #5f3300;

            --suggestions-bg: #2c2800;
            --suggestions-hover-bg: #431e00;
            --suggestions-separator: #555;
            //            --selected-bg: #ffd295d0;

            --links-color: #408cff;
            --derivatives-color: #e6a783;
            --derivatives-items-color: #8fb8d8;

            //    --status-color: #b6bdc7;

            //    --menu-bg: #1b2129;
            //    --menu-hover-bg: #28313c;

            --modal-bg: #45453f;
            --modal-overlay: rgba(0, 0, 0, 0.60);

            //    --order-button-color: #c9946d;
            //    --order-button-hover-color: #ffffff;
        }

        html {
            /*o   اصلاح ریشه‌ای: خاموش‌کردن هایلایت لمسی پیش‌فرض مرورگر برای کل صفحه،
o     نه فقط یک بخش. این تنها راهی است که در وب‌کیت‌های موبایل (به‌خصوص
o     اندروید قدیمی) قابل‌اعتماد است. */
            -webkit-tap-highlight-color: transparent;
            background-color: var(--page-bg);
        }

        body {
            background-color: var(--page-bg);
            color: var(--text-color);
        }

        #search-container {
            display: block;
            width: 100%;
            max-width: 100%;
            margin-top: 14px;
            margin-bottom: 20px;
            position: relative;
            box-sizing: border-box;
        }

        #search-input {
            padding: 10px 35px 10px 10px;
            width: 100%;
            max-width: 100%;
            box-sizing: border-box;
            font-size: 18px;
            color: var(--search-color);
            background-color: var(--search-bg);
            border: 1px solid var(--search-border);
        }

        /* عرض لیست پیشنهاد — هم‌اندازهٔ تقریبی کادر قدیمی، نه تمام صفحه */
        #suggestions {
            left: 0;
            right: auto;
            width: 280px;
            max-width: 100%;
            box-sizing: border-box;
        }

        #clear-search {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: none;
            color: var(--text-color);
            font-size: 27px;
            cursor: pointer;
            display: none;
            z-index: 101;
        }

        #suggestions {
            position: absolute;
            border: 1px solid var(--main-border);
            max-height: 330px;
            overflow-y: auto;
            //            width: 300px;
            background-color: var(--suggestions-bg);
            z-index: 100;
            cursor: pointer;
            font-size: 18px;
        }

        #suggestions div {
            padding: 8px;
            border-bottom: 1px solid var(--suggestions-separator);
        }

        #suggestions div:hover {
            background-color: var(--suggestions-hover-bg);
        }

        #suggestions div.suggestion-selected,
        #combinations-list div.suggestion-selected {
            background-color: var(--domain-bg);
            color: var(--links-color);
            font-weight: bold;
        }

        #history-btn {
            position: absolute;
            left: 100%;
            margin-left: 10px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            //            border: 1px solid var(--main-border);
            border-radius: 6px;
            background: var(--page-bg);
            //            color: var(--text-color);
            font-size: 24px;
            line-height: 1;
            padding: 4px 6px;
            cursor: pointer;
            z-index: 101;
        }

        #history-btn img {
            width: 28px;
            height: 28px;
            display: block;
        }

        #history-btn:hover {
            background: var(--modal-bg);
            border: 1px solid var(--main-border);
        }

        #history-list {
            position: fixed;
            right: 8px;
            top: 105px;
            left: auto;
            margin-left: 0;
            transform: none;
            border: 1px solid var(--main-border);
            max-height: 280px;
            overflow-y: auto;
            min-width: 200px;
            max-width: 250px;
            background-color: var(--modal-bg);
            z-index: 100;
            cursor: pointer;
            font-size: 18px;
            display: none;
            direction: ltr;
            text-align: left;
        }

        #history-list div {
            padding: 8px;
            border-bottom: 1px solid var(--suggestions-separator);
        }

        #history-list div:hover {
            background-color: var(--suggestions-hover-bg);
        }

        #history-list div.history-selected {
            background-color: var(--domain-bg);
            color: var(--links-color);
            font-weight: bold;
        }

        .result-block {
            border: 1px solid var(--main-border);
            padding: 15px;
            direction: rtl;
            //            color: #110817;
            background-color: var(--result-bg);
        }

        .term {
            color: var(--term-color);
            font-weight: bold;
            margin-bottom: 5px;
            direction: ltr;
            text-align: left;
        }

        .source-label {
            font-size: 13px;
            //            font-weight: bold;
            color: var(--source-color);
            margin-bottom: 5px;
            text-align: left;
            direction: ltr;
        }

        .term-source-container {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 10px;
        }

        .domainTag {
            color: var(--domain-color);
            background: var(--domain-bg);
            padding: 2px 5px 5px 5px;
            border: 1px solid var(--domain-border);
            //            border-radius: 10px;
        }

        .derivativesTag {
            color: var(--derivatives-color);
            font-size: 14px;
        }

        .derivativesItems {
            color: var(--derivatives-items-color);
            font-size: 13px;
        }

        .bulletItems {
            color: var(--domain-color);
            font-size: 13px;
        }

        #theme-container {
            position: absolute;
            top: 8px;
            left: 48px;
            z-index: 201;
        }

        #theme-toggle {
            position: absolute;
            top: 0;
            left: 0;

            font-size: 22px;
            line-height: 1;
            padding: 6px 12px;

            border: 1px solid var(--main-border);
            border-radius: 6px;

            background: var(--menu-bg);
            color: var(--text-color);

            cursor: pointer;
        }

        #theme-toggle:hover {
            background: var(--menu-hover-bg);
        }

        #glossary-status {
            /* فاصله از سطر دکمه‌های بالا (× / تم / ⋮) — absolute هستند */
            margin-top: 56px;
            margin-bottom: 8px;
            font-size: 14px;
            color: #888;
        }

        #menu-container {
            position: absolute;
            top: 8px;
            right: 8px;
            z-index: 201;
            display: block;
            text-align: right;
            direction: rtl;
        }

        #menu-toggle {
            font-size: 22px;
            line-height: 1;
            padding: 6px 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            color: var(--text-color);
            background: var(--result-bg);
            cursor: pointer;
        }

        #menu-toggle:hover {
            background: var(--domain-bg);
        }

        .menu-dropdown {
            position: absolute;
            top: calc(100% + 4px);
            right: 0;
            min-width: 220px;
            background: #fff;
            color: #110817;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-shadow: 0 2px 8px var(--modal-overlay);
            z-index: 200;
            direction: rtl;
            text-align: right;
            font-size: 15px;
            overflow: hidden;
            width: 260px;
    box-sizing: border-box;
            /*o رفع باگ محوشدنِ پس‌زمینهٔ منو در Android WebView هنگام اسکرول لمسی:
o           مجبور کردن مرورگر به ساخت یک لایهٔ GPU جدا برای این باکس. */
            transform: translateZ(0);
            -webkit-transform: translateZ(0);
            will-change: transform;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }

        .menu-item {
            padding: 10px 14px;
            cursor: pointer;
            white-space: nowrap;
        }

        .menu-item:hover {
            background: #f0f0f0;
        }

        .menu-separator {
            border-top: 1px solid #ddd;
        }

        .menu-submenu {
            border-top: 1px solid #ddd;
            border-bottom: 1px solid #ddd;
            background: #fafafa;
            border-left: 1px solid #ddd;
            max-height: 270px;
            overflow-y: auto;
            direction: ltr;
            color: #110817;
            /*o رفع باگ محوشدنِ منو هنگام کشیدن انگشت روی لیست گلوساری‌ها در
o           Android WebView: هم لایهٔ GPU جدا، هم جلوگیری از سرریزِ اسکرول
o           به صفحهٔ زیرین. */
            -webkit-overflow-scrolling: touch;
            overscroll-behavior: contain;
            transform: translateZ(0);
            -webkit-transform: translateZ(0);
        }

        .glossary-checkbox-row {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 14px;
            cursor: pointer;
            box-sizing: border-box;
    overflow: hidden;
            //            text-align: right;
        }

        .glossary-checkbox-row:hover {
            background: #eef2f7;
        }

        .glossary-checkbox-row input[type="checkbox"] {
            cursor: pointer;
        }

        .glossary-checkbox-row label {
            cursor: pointer;
            flex: 1;
            text-align: left;
            white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
        }

        .glossary-order-btn {
            cursor: pointer;
            padding: 2px 6px;
            font-size: 19px;
            user-select: none;
            color: #82502b;
            font-weight: bold;
            flex-shrink: 0;
        }

        .glossary-order-btn:hover {
            color: #000;
        }

        .glossary-order-btn.disabled {
            opacity: 0.25;
            pointer-events: none;
        }

        /* ===== Modal ===== */

        #meaning-modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: var(--modal-overlay);
            align-items: center;
            justify-content: center;
        }

        #meaning-modal-box {
            position: relative;
            width: 80%;
            max-width: 600px;
            max-height: 80vh;
            overflow-y: auto;
            background: var(--modal-bg);
            border: 2px solid var(--main-border);
            border-radius: 6px;
            padding: 10px;
            box-sizing: border-box;
            /* when dragged, JS switches this to absolute + left/top */
        }

        #meaning-modal-drag-handle {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 30px;
            padding: 0 0 0 40px;
            cursor: move;
            //            user-select: none;
            //            -webkit-user-select: none;
            touch-action: none;
            //            background: var(--domain-bg);
            //            border-bottom: 1px solid var(--main-border);
            //            border-radius: 6px 6px 0 0;
            //            color: var(--domain-color);
            //            font-size: 13px;
            //            direction: rtl;
        }

        #meaning-modal-drag-handle:active {
            cursor: grabbing;
        }

        #meaning-modal-close {
            position: absolute;
            top: 4px;
            left: 8px;
            border: none;
            color: var(--text-color);
            background: none;
            font-size: 25px;
            cursor: pointer;
            line-height: 1;
            z-index: 2;
        }

        #meaning-modal-content {
            //            padding: 15px;
            //            margin-top: 0;
        }

        #meaning-modal-content .result-block {
            margin-bottom: 0 !important;
            //            padding-bottom: 0 !important;
        }

        #back-to-top,
        #go-to-bottom {
            position: fixed;
            width: 40px;
            height: 40px;
            border: none;
            border-radius: 50%;
            background-color: #c75a00;
            color: white;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
            display: none;
            z-index: 999;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.25);
            opacity: 0.7;
            transition: opacity 0.3s, transform 0.2s;
        }

        #back-to-top {
            bottom: 8px;
            left: 10px;
        }

        #go-to-bottom {
            bottom: 8px;
            right: 10px;
        }

        #back-to-top:active,
        #go-to-bottom:active {
            transform: scale(0.92);
            opacity: 1;
        }

        hr {
            border: none;
            border-top: 1px solid var(--main-border);
        }

        /* حالت پاپ‌آپ (PROCESS_TEXT):
           پنجرهٔ اندروید کاملاً شفاف → صفحهٔ پشت (مرورگر/PDF) دیده می‌شود.
           هیچ لایهٔ نیمه‌تیره؛ فقط کارت شناور مثل #meaning-modal.
           کلیک روی فضای خالی (backdrop شفاف) پاپ‌آپ را می‌بندد. */
        html.popup-mode,
        html.popup-mode body {
            background: transparent !important;
            background-color: transparent !important;
            margin: 0;
            height: 100%;
            /* اسکرول صفحهٔ زیرین قفل؛ اسکرول فقط داخل #popup-card */
            overflow: hidden !important;
        }

        /* backdrop کاملاً شفاف — فقط برای گرفتن کلیک بیرون از کارت */
        #popup-backdrop {
            position: fixed;
            inset: 0;
            background: transparent !important;
            z-index: 900;
            /* لمس از backdrop عبور نکند تا کلیک برای بستن ثبت شود */
            pointer-events: auto;
        }

        #popup-card {
            position: fixed;
            /* حداکثر حدود نصف ارتفاع صفحه */
            top: 25%;
            height: 50%;
            max-height: 50vh;
            left: 5%;
            right: 5%;
            max-width: 560px;
            margin-left: auto;
            margin-right: auto;
            background: var(--page-bg);
            border-radius: 12px;
            overflow-x: hidden;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior: contain;
            z-index: 901;
            padding: 8px 12px 48px 12px;
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.35);
            box-sizing: border-box;
            border: 1px solid var(--main-border);
            touch-action: pan-y;
            pointer-events: auto;
        }

        /* دکمهٔ بستن یکسان برای صفحهٔ اصلی و پاپ‌آپ (هم‌سبک با #meaning-modal-close) — سمت چپ */
        #app-close-btn {
            position: absolute;
            top: 8px;
            left: 8px;
            border: none;
            color: var(--text-color);
            background: none;
            font-size: 25px;
            cursor: pointer;
            line-height: 1;
            z-index: 210;
            padding: 4px 8px;
        }

        #app-close-btn:hover {
            opacity: 0.75;
        }
        
        /* نوار کشیدن بالای کارت پاپ‌آپ */
        #popup-drag-handle {
            /* نوار کشیدن روی همان سطر دکمه‌ها؛ flow را اشغال نمی‌کند تا ⋮ پایین نیاید */
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            cursor: move;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            color: var(--domain-color);
            font-size: 14px;
            letter-spacing: 2px;
            border-radius: 12px 12px 0 0;
            z-index: 200;
            /* وسط نوار کلیک‌پذیر بماند؛ دکمه‌های طرفین z-index بالاتر دارند */
            pointer-events: auto;
        }

        #popup-drag-handle:active {
            cursor: grabbing;
        }

        /* در پاپ‌آپ همهٔ کنترل‌های بالا روی یک سطر */
        html.popup-mode #app-close-btn {
            top: 4px;
            left: 8px;
            z-index: 210;
        }
        html.popup-mode #theme-container {
            top: 4px;
            left: 48px;
            z-index: 210;
        }
        html.popup-mode #menu-container {
            top: 4px;
            right: 8px;
            z-index: 210;
        }


        /* پیکان‌های اسکرول در پاپ‌آپ: fixed می‌مانند ولی مختصات با JS
           از روی getBoundingClientRect کارت تنظیم می‌شود تا با drag حرکت کنند */
        html.popup-mode #back-to-top,
        html.popup-mode #go-to-bottom {
            position: fixed;
            z-index: 950;
            bottom: auto; /* top توسط JS ست می‌شود */
        }


    </style>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ffffff">
</head>

<body>

    <div id="theme-container">
        <button type="button" id="theme-toggle" aria-label="فعال کردن حالت تاریک" title="حالت تاریک">
            ☾
        </button>
    </div>
    <button type="button" id="app-close-btn" aria-label="بستن" title="بستن">×</button>
    <div id="menu-container">
        <button type="button" id="menu-toggle" onclick="toggleMainMenu(event)" aria-label="TriColon">⋮</button>
        <div id="main-menu" class="menu-dropdown" style="display:none;">
            <div class="menu-item" onclick="toggleGlossarySubmenu(event)">📚 واژه‌نامه‌های موجود</div>
            <div id="glossary-submenu" class="menu-submenu" style="display:none;"></div>
            <div class="menu-separator"></div>
            <div class="menu-item" onclick="openGlossaryPicker()">➕ افزودن واژه‌نامهٔ جدید</div>
            <div class="menu-separator"></div>
            <div class="menu-item" onclick="showStorageUsage()">📦 نمایش فضای ذخیره‌سازی</div>
            <div class="menu-separator"></div>
            <div class="menu-item" onclick="toggleHistoryList(event)">📃 سابقهٔ جستجو</div>
            <div class="menu-item" onclick="clearSearchHistory()">🧹 پاک کردن سابقهٔ جستجو</div>
        </div>
    </div>

    <input type="file" id="glossaryPicker" multiple style="display:none" onchange="addGlossaries(this.files)">

    <div id="glossary-status" align="right">… در حال بارگذاری واژه‌نامه‌ها</div>

    <!-- <h1>Glossary Search</h1> -->
    <div id="search-container">
        <input type="text" id="search-input" placeholder="… واژه‌ای وارد کنید"><button id="clear-search" type="button">×</button>
        <div id="suggestions"></div>
        <div id="history-list"></div>
    </div>

    <div id="results-container">
        <!-- Search results -->
    </div>

    <div id="meaning-modal">
        <div id="meaning-modal-box">

            <!-- 
            <div id="meaning-modal-drag-handle" title="برای جابه‌جایی بکشید">
                ⋮⋮  Move || جابجایی || Move
            </div>
         -->
            <div id="meaning-modal-drag-handle" title="برای جابه‌جایی بکشید">
            </div>

            <button type="button" id="meaning-modal-close" aria-label="بستن">
                ×
            </button>

            <div id="meaning-modal-content"></div>

        </div>
    </div>

    <button id="back-to-top" title="بازگشت به بالا">￪</button>
    <button id="go-to-bottom" title="رفتن به پایین">￬</button>

    <script>
        const DEFAULT_GLOSSARY_FILES = [];
        const DEFAULT_GLOSSARY_NAMES = new Set(
            DEFAULT_GLOSSARY_FILES.map(f => f.replace(/\.json$/i, '').replace(/_/g, " "))
        );

        const USER_GLOSSARY_DB_NAME = 'TechnicalDictionaryGlossaries';
        const USER_GLOSSARY_STORE_NAME = 'glossaries';
        const ACTIVE_STATE_STORAGE_KEY = 'techDictionary_glossaryActiveState';
        const SEARCH_HISTORY_STORAGE_KEY = 'techDictionary_searchHistory';
        const MAX_SEARCH_HISTORY = 30;

        let userGlossaryMemory = {};
        let dictionaries = {};
        let allKeysCombined = []; // Stores ORIGINAL keys (with real casing) from ACTIVE glossaries only. Used for suggestions list.
        let loadedGlossaryNames = [];
        let expandedGlossaryName = null; // نام گلوساری‌ای که الان ردیفش «باز» است
        let userGlossaryKeyByDisplayName = {}; // displayName -> original IndexedDB key (for delete)
        let searchHistory = [];

        function loadSearchHistory() {
            try {
                const raw = localStorage.getItem(SEARCH_HISTORY_STORAGE_KEY);
                searchHistory = raw ? JSON.parse(raw) : [];
                if (!Array.isArray(searchHistory)) searchHistory = [];
            } catch (error) {
                console.warn('Could not read search history.', error);
                searchHistory = [];
            }
        }

        function saveSearchHistory() {
            try {

        //o ===== جابه‌جایی Modal با کشیدن نوار بالا =====
        (function setupModalDrag() {
            const box = document.getElementById("meaning-modal-box");
            const handle = document.getElementById("meaning-modal-drag-handle");
            if (!box || !handle) return;

            let isDragging = false;
            let startX = 0;
            let startY = 0;
            let startLeft = 0;
            let startTop = 0;

            function getPoint(e) {
                if (e.touches && e.touches.length) {
                    return {
                        x: e.touches[0].clientX,
                        y: e.touches[0].clientY
                    };
                }
                return {
                    x: e.clientX,
                    y: e.clientY
                };
            }

            function onPointerDown(e) {
                //o فقط کلیک/لمس روی خود نوار (نه دکمه بستن)
                if (e.target === document.getElementById("meaning-modal-close")) return;

                const point = getPoint(e);
                const rect = box.getBoundingClientRect();

                //o تبدیل از حالت flex-مرکز به absolute با مختصات فعلی
                box.style.position = "absolute";
                box.style.left = rect.left + "px";
                box.style.top = rect.top + "px";
                box.style.margin = "0";
                //o عرض را حفظ کن تا در absolute جمع نشود
                box.style.width = rect.width + "px";

                isDragging = true;
                startX = point.x;
                startY = point.y;
                startLeft = rect.left;
                startTop = rect.top;

                handle.style.cursor = "grabbing";
                e.preventDefault();
            }

            function onPointerMove(e) {
                if (!isDragging) return;

                const point = getPoint(e);
                let newLeft = startLeft + (point.x - startX);
                let newTop = startTop + (point.y - startY);

                //o محدود کردن داخل صفحه (با کمی حاشیه)
                const margin = 8;
                const maxLeft = window.innerWidth - box.offsetWidth - margin;
                const maxTop = window.innerHeight - 40; // حداقل نوار بالا دیده شود

                newLeft = Math.max(margin, Math.min(newLeft, maxLeft));
                newTop = Math.max(margin, Math.min(newTop, maxTop));

                box.style.left = newLeft + "px";
                box.style.top = newTop + "px";

                e.preventDefault();
            }

            function onPointerUp() {
                if (!isDragging) return;
                isDragging = false;
                handle.style.cursor = "move";
            }

            handle.addEventListener("mousedown", onPointerDown);
            document.addEventListener("mousemove", onPointerMove);
            document.addEventListener("mouseup", onPointerUp);

            handle.addEventListener("touchstart", onPointerDown, {
                passive: false
            });
            document.addEventListener("touchmove", onPointerMove, {
                passive: false
            });
            document.addEventListener("touchend", onPointerUp);
            document.addEventListener("touchcancel", onPointerUp);
        })();

        // Keeps whatever order the user has already arranged; puts any

        function applyStoredOrder(names) {
            const savedOrder = loadOrderFromStorage();

        function moveGlossary(name, direction) {
            const index = loadedGlossaryNames.indexOf(name);
            if (index === -1) return;
            const newIndex = index + direction;
            if (newIndex < 0 || newIndex >= loadedGlossaryNames.length) return;

            const submenu = document.getElementById("glossary-submenu");

            //o قبل از جابه‌جایی، موقعیتِ فعلیِ همهٔ ردیف‌ها را ثبت می‌کنیم (FIRST)
            const firstRects = new Map();
            submenu.querySelectorAll('.glossary-checkbox-row').forEach(row => {
                firstRects.set(row.dataset.name, row.getBoundingClientRect());
            });
            const scrollBefore = submenu.scrollTop;

            [loadedGlossaryNames[index], loadedGlossaryNames[newIndex]] = [loadedGlossaryNames[newIndex], loadedGlossaryNames[index]];

            saveOrderToStorage();
            renderGlossarySubmenu();

            //o موقعیت جدید را می‌خوانیم (LAST) و با ترفند FLIP، از موقعیت قبلی
            //o به‌آرامی به موقعیت جدید حرکت می‌کنیم تا با چشم قابل‌رؤیت باشد
            submenu.scrollTop = scrollBefore;
            submenu.querySelectorAll('.glossary-checkbox-row').forEach(row => {
                const first = firstRects.get(row.dataset.name);
                if (!first) return;
                const last = row.getBoundingClientRect();
                const deltaY = first.top - last.top;
                if (!deltaY) return;

                row.style.transition = 'none';
                row.style.willChange = 'transform';
                row.style.transform = `translateY(${deltaY}px)`;
                row.getBoundingClientRect(); // اجبار مرورگر به اعمال فوریِ حالت اولیه
                //o یک requestAnimationFrame به‌تنهایی در برخی نسخه‌های Android
                //o WebView کافی نیست تا حالت اولیه واقعاً نقاشی شود؛ با دو تا
                //o تودرتو مطمئن می‌شویم فریم قبلی قطعاً رندر شده است.
                requestAnimationFrame(() => {
                    requestAnimationFrame(() => {
                        row.style.transition = 'transform 0.25s ease';
                        row.style.transform = '';
                    });
                });
                row.addEventListener('transitionend', () => {
                    row.style.transition = '';
                    //o will-change فقط برای مدت انیمیشن لازم بود؛ برداشتنش بعد از
                    //o اتمام کار، از تجمعِ لایه‌های GPU زیاد (که خودش باعث بازگشتِ
                    //o باگ محوشدنِ پس‌زمینهٔ منو می‌شد) در حالت عادیِ اسکرول جلوگیری می‌کند.
                    row.style.willChange = '';
                }, { once: true });
            });
        }

        function rebuildKeysIndex() {
            // Collect ORIGINAL keys (with their real casing) from active glossaries.
            // Suggestions must show gt / Gt / GT as separate items.
            const seen = new Set();
            //o هر آیتم را همراه با نسخهٔ lowercase‌اش نگه می‌داریم تا موقع
            //o مرتب‌سازی، دیگر لازم نباشد toLowerCase را بارها صدا بزنیم.
            const decorated = [];
            for (const dictName in dictionaries) {
                if (!glossaryActiveState[dictName]) continue;
                for (const entryList of dictionaries[dictName].values()) {
                    for (const entry of entryList) {
                        if (entry.originalKey) {
                            const k = entry.originalKey;
                            const lower = k.toLowerCase();
                            const dedupeKey = lower + '|' + k;
                            if (seen.has(dedupeKey)) continue; // exact same string already present
                            seen.add(dedupeKey);
                            decorated.push([lower, k]);
                        }
                    }
                }
            }
            //o localeCompare برای این تعداد آیتم (صدها هزارتا) بسیار کند است؛
            //o یک مقایسهٔ سادهٔ رشته‌ای، برای مرتب‌سازی الفبایی واژه‌نامه‌های
            //o انگلیسی/فارسی، عملاً همان نتیجه را می‌دهد ولی چند برابر سریع‌تر است.
            decorated.sort((a, b) => {
                if (a[0] < b[0]) return -1;
                if (a[0] > b[0]) return 1;
                if (a[1] < b[1]) return -1;
                if (a[1] > b[1]) return 1;
                return 0;
            });
            allKeysCombined = decorated.map(pair => pair[1]);
        }

        function openUserGlossaryDB() {
            return new Promise((resolve, reject) => {
                if (!('indexedDB' in window)) {
                    reject(new Error('IndexedDB is not supported in this browser.'));
                    return;
                }

                const request = indexedDB.open(USER_GLOSSARY_DB_NAME, 1);

                request.onupgradeneeded = function(event) {
                    const db = event.target.result;
                    if (!db.objectStoreNames.contains(USER_GLOSSARY_STORE_NAME)) {
                        db.createObjectStore(USER_GLOSSARY_STORE_NAME, {
                            keyPath: 'name'
                        });
                    }
                };

                request.onsuccess = function(event) {
                    resolve(event.target.result);
                };

                request.onerror = function() {
                    reject(request.error || new Error('Could not open IndexedDB.'));
                };
            });
        }

        async function getStoredUserGlossaries() {
            try {
                const db = await openUserGlossaryDB();
                return await new Promise((resolve, reject) => {
                    const tx = db.transaction(USER_GLOSSARY_STORE_NAME, 'readonly');
                    const store = tx.objectStore(USER_GLOSSARY_STORE_NAME);
                    const request = store.getAll();

                    request.onsuccess = function() {
                        resolve(request.result || []);
                    };

                    request.onerror = function() {
                        reject(request.error || new Error('Could not read user glossaries.'));
                    };

                    tx.oncomplete = function() {
                        db.close();
                    };
                });
            } catch (error) {
                console.warn('IndexedDB unavailable; using memory cache only.', error);
                return Object.entries(userGlossaryMemory).map(([name, data]) => ({
                    name,
                    data
                }));
            }
        }

        async function saveUserGlossary(name, data) {
            try {
                const db = await openUserGlossaryDB();
                await new Promise((resolve, reject) => {
                    const tx = db.transaction(USER_GLOSSARY_STORE_NAME, 'readwrite');
                    const store = tx.objectStore(USER_GLOSSARY_STORE_NAME);
                    const request = store.put({
                        name,
                        data
                    });

                    request.onsuccess = function() {
                        resolve();
                    };

                    request.onerror = function() {
                        reject(request.error || new Error(`Could not save glossary: ${name}`));
                    };

                    tx.oncomplete = function() {
                        db.close();
                    };
                });
            } catch (error) {
                console.warn('IndexedDB save failed; keeping in memory only.', error);
                userGlossaryMemory[name] = data;
            }
        }

        async function deleteUserGlossary(displayName) {
            const key = userGlossaryKeyByDisplayName[displayName];
            if (!key) return;

            const confirmed = confirm(`آیا از حذف واژه‌نامهٔ «${displayName}» مطمئن هستید؟ این کار قابل بازگشت نیست.`);
            if (!confirmed) return;

            try {
                const db = await openUserGlossaryDB();
                await new Promise((resolve, reject) => {
                    const tx = db.transaction(USER_GLOSSARY_STORE_NAME, 'readwrite');
                    const store = tx.objectStore(USER_GLOSSARY_STORE_NAME);
                    const request = store.delete(key);

                    request.onsuccess = function() {
                        resolve();
                    };

                    request.onerror = function() {
                        reject(request.error || new Error(`Could not delete glossary: ${key}`));
                    };

                    tx.oncomplete = function() {
                        db.close();
                    };
                });
            } catch (error) {
                console.warn('IndexedDB delete failed; removing from memory cache.', error);
                delete userGlossaryMemory[key];
            }

            delete glossaryActiveState[displayName];
            saveActiveStateToStorage();

            await loadDictionaries();

            alert(`واژه‌نامهٔ «${displayName}» حذف شد.`);
        }

        function readFileAsText(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = function(e) {
                    resolve(e.target.result);
                };
                reader.onerror = function() {
                    reject(reader.error || new Error(`Could not read file: ${file.name}`));
                };
                reader.readAsText(file, 'UTF-8');
            });
        }

        async function addGlossaries(files) {
            const selectedFiles = Array.from(files || []);
            if (!selectedFiles.length) return;

            let added = 0;
            let failed = 0;
            let skipped = 0;
            const skippedNames = [];
            const addedNames = [];
            const errors = [];

            for (const file of selectedFiles) {
                try {
                    const displayName = file.name.replace(/\.json$/i, '').replace(/_/g, " ");
                    if (loadedGlossaryNames.includes(displayName)) {
                        skipped++;
                        skippedNames.push(displayName);
                        continue;
                    }

                    const text = await readFileAsText(file);
                    const data = JSON.parse(text);

                    if (!data || typeof data !== 'object' || Array.isArray(data)) {
                        throw new Error('فرمت JSON این فایل مناسب نیست.');
                    }

                    //o از همین ابتدا واژه‌نامه را به فرمتِ آماده (پردازش‌شده)
                    //o ذخیره می‌کنیم، نه JSON خام؛ تا هیچ‌وقت لازم نباشد دوباره
                    //o این پردازشِ سنگین تکرار شود.
                    const entries = buildDictEntries(data, displayName);
                    await saveUserGlossary(file.name, entries);
                    added++;
                    addedNames.push(displayName);
                } catch (error) {
                    failed++;
                    errors.push(`${file.name}: ${error.message}`);
                    console.error('Error adding glossary:', file.name, error);
                }
            }

            document.getElementById('glossaryPicker').value = '';

            await loadDictionaries();

            let message = addedNames.length                ? `\nواژه‌نامهٔ «${addedNames.join('»، «')}» اضافه شد.`                : 'هیچ واژه‌نامه‌ای اضافه نشد.';
            if (failed) {
                message += ` ${failed} فایل هم با خطا روبه‌رو شد.`;
            }
            if (skipped) {
                message += `\n واژه‌نامهٔ ${skippedNames.join('، ')} قبلاً اضافه شده بود.`;
            }
            alert(message);
        }

        //o تبدیل دادهٔ خامِ JSON یک واژه‌نامه به فرمتِ آماده (آرایه‌ای از
        //o [کلید, فهرستِ‌مدخل‌ها]) که مستقیماً برای ساخت Map قابل استفاده است.
        //o این تابع هم موقع افزودنِ واژه‌نامهٔ جدید، و هم موقع مهاجرتِ یک‌بارهٔ
        //o واژه‌نامه‌های قدیمی (که هنوز به شکل JSON خام ذخیره شده‌اند) استفاده می‌شود.
        function buildDictEntries(data, dictName) {
            const map = new Map();
            for (const key in data) {
                const entry = data[key];
                const lowerKey = key.toLowerCase();

                let definition = entry[0];
                let variants = [];

                if (entry.length > 1 && Array.isArray(entry[1])) {
                    variants = entry[1].map(v => String(v).toLowerCase());
                }

                if (!map.has(lowerKey)) {
                    map.set(lowerKey, []);
                }

                map.get(lowerKey).push({
                    definition: definition,
                    variants: variants,
                    source: dictName,
                    originalKey: key
                });
            }
            return Array.from(map.entries());
        }

        async function loadDictionaries() {
            try {
                const results = [];

                const defaultResults = await Promise.allSettled(
                    DEFAULT_GLOSSARY_FILES.map(async (fileName) => {
                        const response = await fetch(fileName);
                        if (!response.ok) {
                            throw new Error(`HTTP error! status: ${response.status} for ${fileName}`);
                        }
                        const data = await response.json();
                        const dictName = fileName.replace(/\.json$/i, '').replace(/_/g, " ");
                        return {
                            dictName,
                            data,
                            isLegacyRaw: true,
                            storageKey: null
                        };
                    })
                );

                defaultResults.forEach(result => {
                    if (result.status === 'fulfilled' && result.value) {
                        results.push(result.value);
                    } else if (result.status === 'rejected') {
                        console.warn('Default glossary load failed:', result.reason);
                    }
                });

                const userResults = await getStoredUserGlossaries();
                const newUserKeyMap = {};
                userResults.forEach(item => {
                    if (item && item.name && item.data) {
                        const dictName = item.name.replace(/\.json$/i, '').replace(/_/g, " ");
                        results.push({
                            dictName,
                            data: item.data,
                            //o اگر دادهٔ ذخیره‌شده آرایه نیست، یعنی هنوز به فرمت قدیمیِ
                            //o JSON خام است و باید یک‌بار پردازش و مهاجرت شود.
                            isLegacyRaw: !Array.isArray(item.data),
                            storageKey: item.name
                        });
                        newUserKeyMap[dictName] = item.name;
                    }
                });
                userGlossaryKeyByDisplayName = newUserKeyMap;

                dictionaries = {};
                loadedGlossaryNames = [];

                results.forEach(({
                    dictName,
                    data,
                    isLegacyRaw,
                    storageKey
                }) => {
                    loadedGlossaryNames.push(dictName);

                    if (isLegacyRaw) {
                        //o فرمت خام: همین یک‌بار پردازش می‌کنیم (کندترین حالت)، و اگر
                        //o مربوط به واژه‌نامهٔ کاربر باشد، نسخهٔ آماده را برای دفعات
                        //o بعد ذخیره می‌کنیم تا این حلقهٔ سنگین دیگر تکرار نشود.
                        const entries = buildDictEntries(data, dictName);
                        dictionaries[dictName] = new Map(entries);
                        if (storageKey) {
                            saveUserGlossary(storageKey, entries).catch(() => {});
                        }
                    } else {
                        //o فرمت از‌پیش‌آماده: بازسازیِ فوریِ Map، بدون حلقهٔ سنگین.
                        dictionaries[dictName] = new Map(data);
                    }
                });

                loadedGlossaryNames = applyStoredOrder([...new Set(loadedGlossaryNames)]);
                saveOrderToStorage();

                // Preserve existing active/inactive choices; default new glossaries to active.
                const newActiveState = {};
                loadedGlossaryNames.forEach(name => {
                    newActiveState[name] = Object.prototype.hasOwnProperty.call(glossaryActiveState, name) ?
                        glossaryActiveState[name] :
                        true;
                });
                glossaryActiveState = newActiveState;

                rebuildKeysIndex();
                renderGlossarySubmenu();
                updateGlossaryStatus();
            } catch (error) {
                console.error("Error loading dictionaries:", error);
                document.getElementById("results-container").innerHTML =
                    `<div class="result-block"><span class="notFound">Error loading data: ${error.message}</span></div>`;
                document.getElementById('glossary-status').textContent = 'خطا در بارگذاری واژه‌نامه‌ها';
            }
        }

        function updateSuggestions(query) {
            const suggestionsDiv = document.getElementById("suggestions");
            suggestionsDiv.innerHTML = '';
            const historyList = document.getElementById("history-list");
            if (historyList) historyList.style.display = 'none';
            const lowerQuery = query.toLowerCase().trim();

            if (!lowerQuery) {
                return;
            }

            // Filter by startsWith on lowercase version, but display the ORIGINAL casing.
            // Variants are NEVER shown in the suggestions list – only real keys.
            const matchingKeys = allKeysCombined.filter(key =>
                key.toLowerCase().startsWith(lowerQuery)
            );

            matchingKeys.slice(0, 20).forEach(key => {
                const div = document.createElement('div');
                div.textContent = key; // shows gt / Gt / GT exactly as in JSON
                div.onclick = () => {
                    //o اول فقط همین یک سطر را علامت‌گذاری می‌کنیم تا رنگش عوض شود...
                    div.classList.add('suggestion-selected');
                    document.getElementById("search-input").value = key;

                    //o ...و به مرورگر یک لحظه فرصت می‌دهیم تا واقعاً همین رنگ را نقاشی کند،
                    //o قبل از اینکه کل لیست را پاک کنیم. بدون این تأخیر، در برخی
                    //o مرورگرها/وب‌ویوها، عنصر همان لحظه از صفحه حذف می‌شود و فرصت
                    //o نقاشی‌شدن رنگ اصلاً پیش نمی‌آید (به همین دلیل رفتار قبلی نامنظم بود).
                    requestAnimationFrame(() => {
                        setTimeout(() => {
                            suggestionsDiv.innerHTML = '';
                            showMeaning(key);
                        }, 111);
                    });
                };
                suggestionsDiv.appendChild(div);
            });
        }

        function showMeaning(term) {

                    dictionaries[dictName].get(lowerTerm).forEach(entry => {
                        matches.push({
                            entry: entry,
                            originalKey: entry.originalKey,
                            matchedViaVariant: false
                        });

                for (const [key, entryList] of dictionaries[dictName]) {
                    entryList.forEach(entry => {
                        if (entry.variants && entry.variants.includes(lowerTerm)) {
                            matches.push({
                                entry: entry,
                                originalKey: entry.originalKey,

                //o همهٔ معانیِ یک گلوساری در یک بلوک؛ فاصله و خط جدا فقط بین گلوساری‌ها
                if (matches.length > 0) {

                    resultBlock.style.marginBottom = "20px";

                    html += `<div class="source-label">${sourceLabelSpan} </div>`;

                    matches.forEach((match, index) => {

                        if (index > 0) {

                            html += `<div style="margin:16px auto; border-top:4px solid var(--main-border);"><br></div>`;
                        }

                        if (match.matchedViaVariant) {
                            html += `<div class="term"> 👉 ${originalKey}</div><p>${foundEntry.definition}`;
                            //                            if (foundEntry.variants && foundEntry.variants.length > 0) {
                            //                                html += `<p><strong>دیگرسان‌های "${originalKey}":</strong> عبارتند از: ${foundEntry.variants.map(v =>
                            //                                    `<a href="#" onclick="showMeaning('${v}'); return false;">${v}</a>`
                            //                                ).join(', ')}</p>`;
                            //                            }
                            const termDisplay = originalKey;
                            //                            html += `
                            //                            <div class="term-source-container">
                            //                                <strong class="term">${termDisplay}</strong>
                            //                                ${sourceLabelSpan}
                            //                            </div>
                            //                            `;
                            html += `<small><small><small><HR>عبارت مورد جستجو <strong>${term}</strong> است که به <strong>${originalKey}</strong> اشاره دارد.</small></small></small>`;
                        } else {
                            //                            alert(term);
                            const termDisplay = originalKey;
                            html += `<div class="term">${termDisplay}</div>`;
                            html += `<p>${foundEntry.definition}</p>`;
                            //                            if (foundEntry.variants && foundEntry.variants.length > 0) {
                            //                                html += `<p><strong>دیگرسان‌ها:</strong> ${foundEntry.variants.map(v =>
                            //                                    `<a href="#" onclick="showMeaning('${v}'); return false;">${v}</a>`
                            //                                ).join(', ')}</p>`;
                            //                            }
                        }
                    });

                    resultBlock.innerHTML = renderMeaning(html);
                    resultsContainer.appendChild(resultBlock);
                }
            }

            if (!foundAny) {
                const resultBlock = document.createElement('div');
                resultBlock.className = 'result-block';
                resultBlock.innerHTML = `<span class="notFound">عبارت "${term}" یافت نشد.</span>`;
                resultsContainer.appendChild(resultBlock);
            }
            if (foundAny) {
                addToSearchHistory(term);

                const count = combinationsList(term, true);

                if (count > 0) {

                    const btn = document.createElement("button");
                    btn.textContent = `▼ ترکیب‌ها (${count})`;
                    btn.onclick = () => combinationsList(term);

                    resultsContainer.appendChild(btn);
                }

        function combinationsList(term, countOnly = false) {

            term = term.toLowerCase().trim();

            const results = [];

            const re = new RegExp(
                "(^|[^A-Za-z0-9])" +
                term.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") +
                "([^A-Za-z0-9]|$)",
                "i"
            );

            for (const key of allKeysCombined) {

                if (re.test(key) && key.toLowerCase() !== term) {
                    results.push(key);
                }

            }

            if (countOnly) {
                return results.length;
            }

            const oldList = document.getElementById("combinations-list");

            if (oldList) {
                oldList.remove();
                return;
            }
            const resultsContainer = document.getElementById("results-container");

            const list = document.createElement("div");
            list.id = "combinations-list";
            list.style.marginTop = "15px";

            const title = document.createElement("div");
            title.innerHTML = "<hr><b>عبارت‌های حاوی «" + term + "»</b><br><br>";

            list.appendChild(title);

            results.forEach(key => {

                const item = document.createElement("div");

                item.textContent = "⁃ " + key;

                item.style.cursor = "pointer";
                item.style.padding = "3px 0";

                item.onclick = () => {

                    //o همه آیتم‌های قبلی را از حالت انتخاب خارج کن
                    document.querySelectorAll("#combinations-list div").forEach(el => {
                        el.classList.remove("suggestion-selected");
                    });

                    //o همین آیتم را انتخاب‌شده کن
                    item.classList.add("suggestion-selected");

                    //o یک لحظه فرصت بده تا رنگ واقعاً دیده شود
                    requestAnimationFrame(() => {

                        setTimeout(() => {

                            const resultsContainer =
                                document.getElementById("results-container");

                            const searchInput =
                                document.getElementById("search-input");

                            //o ذخیرهٔ مقدار فعلی کادر جستجو
                            const originalSearchValue =
                                searchInput.value;

                            //o انتقال موقت عناصر واقعی صفحهٔ اصلی به Fragment
                            const originalFragment =
                                document.createDocumentFragment();

                            while (resultsContainer.firstChild) {
                                originalFragment.appendChild(
                                    resultsContainer.firstChild
                                );
                            }

                            //o همان تابع اصلی و سالم برنامه
                            showMeaning(key);

                            //o نتیجهٔ کامل و قالب‌بندی‌شدهٔ ترکیب
                            const modalHTML =
                                resultsContainer.innerHTML;

                            //o حذف نتیجهٔ موقت
                            resultsContainer.innerHTML = "";

                            //o بازگرداندن همان عناصر واقعی صفحهٔ اصلی
                            resultsContainer.appendChild(
                                originalFragment
                            );

                            //o بازگرداندن مقدار اصلی کادر جستجو
                            searchInput.value =
                                originalSearchValue;

                            //o نمایش نتیجهٔ ترکیب در Modal
                            openMeaningModal(modalHTML);

                        }, 111);

                    });
                };

                list.appendChild(item);

            });

            resultsContainer.appendChild(list);

            list.scrollIntoView({
                behavior: 'smooth',
                block: 'start'
            });

        }

        function renderMeaning(rawText) {
            if (!rawText) return "";
            let t = String(rawText);


            t = t.replace(/\n/g, "<p>");

            t = t.replace(/<p>([\s\S]*?)(?=<p>|$)/g, function(match, content) {
                const start = content.replace(/^[\s\u00A0]*/, '');

                const startsWithDigit = /^[\d٠-٩۰-۹]/.test(start);
                const startsWithLetter = !startsWithDigit && /^[\u0600-\u06FFa-zA-Z]/.test(start);

                if (startsWithLetter) {
                    return `<p style="text-indent:0;">${content}`;
                } else {
                    return `<p style="text-indent:-10px;">${content}`;
                }
            });

            t = t.replace(
                /<p([^>]*)>([\s\S]*?)(?=<p|$)/g,
                function(match, attrs, content) {

                    //o اولین حرف واقعی (فارسی یا انگلیسی) را پیدا کن
                    const m = content.match(/[A-Za-z\u0622-\u06CC]/);

                    if (!m) {
                        return match;
                    }

                    if (/[A-Za-z]/.test(m[0])) {
                        return `<p${attrs} dir="ltr" style="text-align:left;">${content}`;
                    }

                    return match;
                }
            );
            t = t.replace(/•/g, '<span class="bulletItems">●</span>');
            t = t.replace(/(⦗[^⦘]+⦘)/g, '<span class="domainTag">$1</span>');
            t = t.replace(/⦅([^⦆]*?)⦆/g, '<span class="derivativesTag">$1</span>');
            t = t.replace(/⟨([^⟩]*?)⟩/g, '<span class="derivativesItems">$1</span>'); // U+27e8 = ⟨  and U+27e9 = ⟩
            t = t.replace(/〈([^⟩]*?)〉/g, '<span class="derivativesItems">$1</span>'); // U+2329 = 〈  and  U+232a = 〉

            return t;
        }

        const clearBtn = document.getElementById("clear-search");

        function getScrollContext() {
            // در پاپ‌آپ اسکرول روی #popup-card است؛ در صفحهٔ اصلی روی window
            const card = document.getElementById('popup-card');
            if (document.documentElement.classList.contains('popup-mode') && card) {
                return {
                    el: card,
                    scrollTop: card.scrollTop,
                    viewH: card.clientHeight,
                    fullH: card.scrollHeight,
                    scrollTo: (top) => card.scrollTo({ top, behavior: 'smooth' })
                };
            }
            const scrollTop = window.scrollY || document.documentElement.scrollTop;
            const viewH = window.innerHeight;
            const fullH = document.documentElement.scrollHeight;
            return {
                el: window,
                scrollTop,
                viewH,
                fullH,
                scrollTo: (top) => window.scrollTo({ top, behavior: 'smooth' })
            };
        }

        function updateScrollButtons() {
            if (!backToTopBtn || !goToBottomBtn) return;
            const ctx = getScrollContext();
            const isScrollable = ctx.fullH > ctx.viewH + 40;

            if (isScrollable && ctx.scrollTop > 80) {
                backToTopBtn.style.display = "block";
            } else {
                backToTopBtn.style.display = "none";
            }

            if (isScrollable && (ctx.scrollTop + ctx.viewH < ctx.fullH - 60)) {
                goToBottomBtn.style.display = "block";
            } else {
                goToBottomBtn.style.display = "none";
            }
            if (typeof syncScrollButtonsToCard === 'function') {
                syncScrollButtonsToCard();
            }
        }

        window.addEventListener("scroll", updateScrollButtons);
        window.addEventListener("resize", updateScrollButtons);

        // اگر پاپ‌آپ بعداً ساخته شد، روی کارت هم listener بگذار
        function bindPopupCardScroll() {
            const card = document.getElementById('popup-card');
            if (card && !card._scrollButtonsBound) {

                card._scrollButtonsBound = true;
            }
            updateScrollButtons();
        }
        // مشاهدهٔ اضافه شدن کارت
        const _popupScrollObserver = new MutationObserver(bindPopupCardScroll);
        _popupScrollObserver.observe(document.documentElement, { childList: true, subtree: true });
        bindPopupCardScroll();

        //o وعده‌ای که وقتی بارگذاری واژه‌نامه‌ها تمام شد، برآورده می‌شود؛
        //o حالت پاپ‌آپ در پایین همین فایل از آن استفاده می‌کند.

        //o حالت پاپ‌آپ: وقتی این صفحه از داخل منوی انتخاب متن اندروید
        //o (ProcessTextActivity، برای PROCESS_TEXT) با آدرس
        //o ?popup=1&word=... باز می‌شود، به‌محض تمام‌شدن بارگذاریِ
        //o واژه‌نامه‌ها، مستقیماً معنای همان کلمه نشان داده می‌شود.
        function closeAppOrPopup() {
            if (document.documentElement.classList.contains('popup-mode')) {
                if (window.AndroidPopup && window.AndroidPopup.close) {
                    window.AndroidPopup.close();
                } else {
                    history.back();
                }
                return;
            }
            // خروج از صفحهٔ اصلی — پل Java در MainActivity
            try {
                if (window.AndroidApp && window.AndroidApp.close) {
                    window.AndroidApp.close();
                    return;
                }
            } catch (e) {}
            try {
                if (window.Capacitor && Capacitor.Plugins && Capacitor.Plugins.App) {
                    Capacitor.Plugins.App.exitApp();
                    return;
                }
            } catch (e) {}
            try {
                if (navigator.app && navigator.app.exitApp) {
                    navigator.app.exitApp();
                    return;
                }
            } catch (e) {}
            history.back();
        }

        (function wireAppCloseBtn() {
            const btn = document.getElementById('app-close-btn');
            if (btn) btn.addEventListener('click', closeAppOrPopup);
        })();

        /** پیکان‌های بالا/پایین را گوشهٔ پایین کارت پاپ‌آپ می‌چسباند (با drag جابه‌جا می‌شوند). */
        function syncScrollButtonsToCard() {
            if (!document.documentElement.classList.contains('popup-mode')) return;
            const card = document.getElementById('popup-card');
            const up = document.getElementById('back-to-top');
            const down = document.getElementById('go-to-bottom');
            if (!card) return;
            const rect = card.getBoundingClientRect();
            const size = 40;
            const pad = 8;
            if (up) {
                up.style.position = 'fixed';
                up.style.left = (rect.left + pad) + 'px';
                up.style.right = 'auto';
                up.style.top = (rect.bottom - size - pad) + 'px';
                up.style.bottom = 'auto';
            }
            if (down) {
                down.style.position = 'fixed';
                down.style.left = (rect.right - size - pad) + 'px';
                down.style.right = 'auto';
                down.style.top = (rect.bottom - size - pad) + 'px';
                down.style.bottom = 'auto';
            }
        }

        (function initPopupMode() {
            const params = new URLSearchParams(location.search);
            if (params.get('popup') !== '1') return;

            document.documentElement.classList.add('popup-mode');

            const closePopup = closeAppOrPopup;

            // همهٔ محتوای body را داخل کارت شناور می‌گذاریم.
            const backdrop = document.createElement('div');
            backdrop.id = 'popup-backdrop';
            backdrop.addEventListener('click', closePopup);

            const card = document.createElement('div');
            card.id = 'popup-card';
            while (document.body.firstChild) {
                card.appendChild(document.body.firstChild);
            }

            // نوار کشیدن در بالای کارت
            const dragHandle = document.createElement('div');
            dragHandle.id = 'popup-drag-handle';
            dragHandle.title = 'برای جابه‌جایی بکشید';
            dragHandle.textContent = '⋮⋮⋮⋮';
            card.insertBefore(dragHandle, card.firstChild);

            document.body.appendChild(backdrop);
            document.body.appendChild(card);

//o ===== جابه‌جایی کارت پاپ‌آپ (مشابه Modal) =====
            (function setupPopupDrag() {
                const handle = dragHandle;
                let isDragging = false;
                let startX = 0, startY = 0, startLeft = 0, startTop = 0;

                function getPoint(e) {
                    if (e.touches && e.touches.length) {
                        return { x: e.touches[0].clientX, y: e.touches[0].clientY };
                    }
                    return { x: e.clientX, y: e.clientY };
                }

                function onPointerDown(e) {
                    if (e.target.closest && e.target.closest('#app-close-btn, #theme-toggle, #menu-toggle, button, a, input')) {
                        return;
                    }
                    const point = getPoint(e);
                    const rect = card.getBoundingClientRect();

                    card.style.position = 'fixed';
                    card.style.left = rect.left + 'px';
                    card.style.top = rect.top + 'px';
                    card.style.right = 'auto';
                    card.style.bottom = 'auto';
                    card.style.width = rect.width + 'px';
                    card.style.height = rect.height + 'px';
                    card.style.maxHeight = 'none';
                    card.style.margin = '0';

                    isDragging = true;
                    startX = point.x;
                    startY = point.y;
                    startLeft = rect.left;
                    startTop = rect.top;
                    handle.style.cursor = 'grabbing';
                    syncScrollButtonsToCard();
                    e.preventDefault();
                }

                function onPointerMove(e) {
                    if (!isDragging) return;
                    const point = getPoint(e);
                    let newLeft = startLeft + (point.x - startX);
                    let newTop = startTop + (point.y - startY);

                    const margin = 8;
                    const maxLeft = window.innerWidth - card.offsetWidth - margin;
                    const maxTop = window.innerHeight - 48;

                    newLeft = Math.max(margin, Math.min(newLeft, Math.max(margin, maxLeft)));
                    newTop = Math.max(margin, Math.min(newTop, Math.max(margin, maxTop)));

                    card.style.left = newLeft + 'px';
                    card.style.top = newTop + 'px';
                    syncScrollButtonsToCard();
                    e.preventDefault();
                }

                function onPointerUp() {
                    if (!isDragging) return;
                    isDragging = false;
                    handle.style.cursor = 'move';
                    syncScrollButtonsToCard();
                }

                handle.addEventListener('mousedown', onPointerDown);
                document.addEventListener('mousemove', onPointerMove);
                document.addEventListener('mouseup', onPointerUp);
                handle.addEventListener('touchstart', onPointerDown, { passive: false });
                document.addEventListener('touchmove', onPointerMove, { passive: false });
                document.addEventListener('touchend', onPointerUp);
                document.addEventListener('touchcancel', onPointerUp);
            })();

            // موقعیت اولیهٔ پیکان‌ها نسبت به کارت
            syncScrollButtonsToCard();
            window.addEventListener('resize', syncScrollButtonsToCard);

            const word = params.get('word') || '';

            window.addEventListener('load', async () => {
                await dictionariesReadyPromise;
                if (word) {
                    const input = document.getElementById('search-input');
                    if (input) {
                        input.value = word;
                        const clearBtn = document.getElementById('clear-search');
                        if (clearBtn) clearBtn.style.display = 'block';
                    }
                    showMeaning(word);
                }
                if (typeof bindPopupCardScroll === 'function') bindPopupCardScroll();
                else {
                    const c = document.getElementById('popup-card');
                    if (c) c.addEventListener('scroll', updateScrollButtons);
                    updateScrollButtons();
                }
                syncScrollButtonsToCard();
            });
        })();
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => {
                navigator.serviceWorker.register("./service-worker.js")
                    .then(() => console.log("Service Worker registered"))
                    .catch(error => console.error("Service Worker registration failed:", error));
            });
        }
    </script>
