name: Build APK from zip

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          mkdir tmp
          unzip -q -o ./*.zip -d tmp
          PKG=$(find tmp -maxdepth 3 -name package.json -not -path "*/node_modules/*" | head -n1)
          cp -r "$(dirname "$PKG")" project

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install npm dependencies
        working-directory: project
        run: npm install

      - name: Capacitor sync
        working-directory: project
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x project/android/gradlew

      - name: Build debug APK
        working-directory: project/android
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: noorodict-debug-apk
          path: project/android/app/build/outputs/apk/debug/app-debug.apk
